name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (versiones exactas)
        run: npm ci

      - name: Comprobación de tipos (TypeScript estricto)
        run: npm run typecheck

      - name: Lint (ESLint + typescript-eslint)
        run: npm run lint

      - name: Pruebas (Vitest, suite completa del dominio)
        run: npm test

      - name: Instalar Python 3.12 (pruebas del backend de entrenamiento)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruebas de Python (motor gemelo, .lba y flujo Kaggle)
        run: |
          python -m pip install --upgrade pip
          # Instalación en dos pasos (safetensors no está en el índice de
          # PyTorch): torch desde el índice CPU, el resto desde PyPI.
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors==0.8.0 numpy==2.1.3 pytest==9.0.2
          python -m pytest entrenamiento/pruebas/ -q

      - name: Build de producción (Vite, trabajador web incluido)
        run: npm run build

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
